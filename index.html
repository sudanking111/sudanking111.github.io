<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة قرد الضرب الذكي</title>
    <style>
        /* CSS - التصميم */
        :root {
            --primary-color: #795548; /* لون خشبي */
            --accent-color: #4CAF50; /* لون أخضر */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 450px;
            border: 5px solid var(--primary-color);
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .monkey-stage {
            position: relative;
            height: 300px;
            background: #f9f9f9;
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 20px 20px; /* شكل شبكة خلفية */
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px inset #ddd;
            overflow: hidden;
        }

        /* مربع النتيجة (يد القرد) */
        .result-box {
            position: absolute;
            bottom: 50px; /* نقطة البداية */
            left: 50%;
            width: 60px;
            height: 60px;
            border: 4px solid var(--accent-color);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }

        .result-box::before {
            content: "🐵"; /* وجه القرد */
            position: absolute;
            top: -35px;
            font-size: 30px;
        }

        .controls {
            background: #f1f1f1;
            padding: 15px;
            border-radius: 12px;
        }

        .leg-control {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .number-display {
            background: var(--primary-color);
            color: white;
            padding: 2px 10px;
            border-radius: 5px;
            min-width: 25px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>قرد الضرب التعليمي 🐒</h2>
        
        <div class="monkey-stage">
            <div id="result-box" class="result-box">1</div>
        </div>

        <div class="controls">
            <div class="leg-control">
                <div class="label-row">
                    <span>القدم اليمنى (الرقم الأول):</span>
                    <span class="number-display" id="val1">1</span>
                </div>
                <input type="range" id="num1" min="1" max="12" value="1">
            </div>
            
            <div class="leg-control">
                <div class="label-row">
                    <span>القدم اليسرى (الرقم الثاني):</span>
                    <span class="number-display" id="val2">1</span>
                </div>
                <input type="range" id="num2" min="1" max="12" value="1">
            </div>
        </div>
    </div>

    <script>
        // JS - المنطق والبرمجة
        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const val1Display = document.getElementById('val1');
        const val2Display = document.getElementById('val2');
        const resultBox = document.getElementById('result-box');

        function updateGame() {
            const n1 = parseInt(num1Input.value);
            const n2 = parseInt(num2Input.value);
            const result = n1 * n2;

            // تحديث الأرقام المعروضة
            val1Display.innerText = n1;
            val2Display.innerText = n2;
            resultBox.innerText = result;

            // حساب الحركة الميكانيكية (محاكاة)
            // نستخدم n1 و n2 لتحديد موقع المربع في الشاشة
            const moveX = (n1 - 6.5) * 25; // تحريك يميناً ويساراً بناءً على الأرقام
            const moveY = (n2 * 15) * -1;  // تحريك للأعلى بناءً على الرقم الثاني

            // تطبيق الحركة بالـ CSS Transform
            resultBox.style.transform = `translate(${moveX}px, ${moveY}px)`;
            
            // تغيير لون الإطار بناءً على كبر الرقم
            const hue = (result / 144) * 120; // يتدرج من الأحمر للأخضر
            resultBox.style.borderColor = `hsl(${hue}, 70%, 50%)`;
        }

        // الاستماع لتغيير السحب في أجهزة الأندرويد واللمس
        num1Input.addEventListener('input', updateGame);
        num2Input.addEventListener('input', updateGame);

        // تشغيل اللعبة عند التحميل لأول مرة
        window.onload = updateGame;
    </script>
</body>
</html>

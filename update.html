<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f3f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }

        .download-btn { background-color: #1a73e8; color: white; padding: 12px 24px; border: none; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.2s; width: 100%; }
        .download-btn:hover { background-color: #1765cc; }

<div class="card">
